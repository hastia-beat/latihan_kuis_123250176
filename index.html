<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shoes air runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#EEEEEE] text-black min-h-screen flex flex-col font-sans">

    <!-- navbar -->
    <nav class="bg-white flex justify-between items-center px-20 py-4 shadow-sm">
        <a href="#" class="font-extrabold tracking-widest text-xl">SHOES.</a>
        <div class="font-medium space-x-6 text-sm">
            <a href="#">Home</a>
            <a href="#">Product</a>
            <a href="#">About</a>
        </div>
    </nav>
    
    <!-- main -->
    <main class="flex-1 flex justify-center items-center p-5">
        <div id="productCard" class="bg-stone-200 rounded-2xl flex flex-row max-w-3xl shadow-sm p-6 gap-8">
            
            <!-- image -->
            <div class="flex-1 bg-[#DDDDDD] rounded-2xl overflow-hidden flex items-center justify-center">
                <img src="image.png" alt="" class="w-full h-full object-cover">
            </div>

            <!-- product -->
            <div class="flex-1 flex flex-col justify-center">
                <div class="text-[#777777] text-xs font-bold tracking-widest mb-2">RUNNING SHOES</div>
                <h1 class="font-bold text-3xl mb-3">Air Runner</h1>
                <p class="text-[#666666] text-sm mb-5">Sepatu ringan dan nyaman untuk digunakan saat berolahraga maupun aktivitas sehari-hari.</p>
                <div class="text-xl font-bold mb-5">Rp. 899.000</div>
                <div class="mb-5">
                    <div class="text-sm mb-2">pilih warna: </div>
                    <div class="flex gap-2.5">
                        <button onclick="changecolor('#DDDDDD')" class="w-7 h-7 bg-[#222222] rounded-full outline outline-white"></button>
                        <button onclick="changecolor('#CFE2FF')" class="w-7 h-7 bg-[#4A7BB0] rounded-full outline outline-white"></button>
                        <button onclick="changecolor('#F5E6CC')" class="w-7 h-7 bg-[#E3CDB0] rounded-full outline outline-white"></button>
                    </div>
                </div>
                <button class="w-full bg-black text-white font-bold text-sm py-3 rounded-2xl hover:bg-[#444444]">Add to Cart</button>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
